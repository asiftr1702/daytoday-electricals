<div class="cpw-page">
  <div class="cpw-card">
    <div class="cpw-icon" aria-hidden="true">🔑</div>
    <h1 class="cpw-title">Change Password</h1>
    <p class="cpw-subtitle">Update the admin password stored in Firestore.</p>

    @if (success()) {
      <div class="cpw-alert cpw-alert-success" role="status">
        ✅ Password changed successfully!
      </div>
    }
    @if (error()) {
      <div class="cpw-alert cpw-alert-error" role="alert">{{ error() }}</div>
    }

    <div class="cpw-form">
      <div class="cpw-field">
        <label for="cpw-current" class="cpw-label">Current Password</label>
        <div class="cpw-input-wrap">
          <input
            id="cpw-current"
            [type]="showCurrent() ? 'text' : 'password'"
            class="cpw-input"
            placeholder="Enter current password"
            autocomplete="current-password"
            [value]="current()"
            (input)="current.set($any($event.target).value)"
          />
          <button type="button" class="cpw-eye" (click)="showCurrent.set(!showCurrent())"
            [attr.aria-label]="showCurrent() ? 'Hide' : 'Show'">
            {{ showCurrent() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="cpw-field">
        <label for="cpw-new" class="cpw-label">New Password</label>
        <div class="cpw-input-wrap">
          <input
            id="cpw-new"
            [type]="showNew() ? 'text' : 'password'"
            class="cpw-input"
            placeholder="Min. 6 characters"
            autocomplete="new-password"
            [value]="newPw()"
            (input)="newPw.set($any($event.target).value)"
          />
          <button type="button" class="cpw-eye" (click)="showNew.set(!showNew())"
            [attr.aria-label]="showNew() ? 'Hide' : 'Show'">
            {{ showNew() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="cpw-field">
        <label for="cpw-confirm" class="cpw-label">Confirm New Password</label>
        <div class="cpw-input-wrap">
          <input
            id="cpw-confirm"
            [type]="showConfirm() ? 'text' : 'password'"
            class="cpw-input"
            placeholder="Re-enter new password"
            autocomplete="new-password"
            [value]="confirm()"
            (input)="confirm.set($any($event.target).value)"
          />
          <button type="button" class="cpw-eye" (click)="showConfirm.set(!showConfirm())"
            [attr.aria-label]="showConfirm() ? 'Hide' : 'Show'">
            {{ showConfirm() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button
        type="button"
        class="cpw-btn"
        [disabled]="loading()"
        (click)="submit()"
      >
        @if (loading()) {
          <span class="cpw-spinner" aria-hidden="true"></span>
          Updating…
        } @else {
          💾 Update Password
        }
      </button>
    </div>
  </div>
</div>
