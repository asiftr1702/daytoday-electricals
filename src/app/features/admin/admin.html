<div class="admin-container">

  <!-- Header -->
  <div class="admin-header">
    <h1>📦 Admin</h1>
    <p>Manage products &amp; catalogue</p>
  </div>

  <div class="admin-content">

    <p class="admin-hub-sub">Select a section to manage</p>

    <div class="admin-hub-grid">

      @for (cat of catalogueConfig.categories(); track cat.id) {
        <a class="admin-hub-card" [routerLink]="['/admin/category', cat.id]">
          <span class="hub-card-icon">{{ cat.icon }}</span>
          <div class="hub-card-info">
            <span class="hub-card-name">{{ cat.name }}</span>
            <span class="hub-card-desc">{{ cat.description }}</span>
          </div>
          <span class="hub-card-arrow">→</span>
        </a>
      }

    </div>

    <p class="admin-hub-sub admin-hub-sub-tools">Tools</p>

    <div class="admin-hub-grid">
      <a class="admin-hub-card admin-hub-card-alert" routerLink="/low-stock">
        <span class="hub-card-icon">⚠️</span>
        <div class="hub-card-info">
          <span class="hub-card-name">Low Stock</span>
          <span class="hub-card-desc">Items at or below their minimum threshold</span>
        </div>
        <span class="hub-card-arrow">→</span>
      </a>
    </div>

  </div><!-- /admin-content -->
</div>
